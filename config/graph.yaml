  # --- fix round 4 (Ruling R18): deterministic post-verification dedup / restore / split rules --------
  # Entities of one type are grouped by a dedup key: transliteration folds, owner-prefix rewrites, light
  # verb / generic-head stripping (procedures), then cross-language / variant pairs. The group's vertex id
  # keeps one of its original keys (the one equal to the dedup key, else the most frequent), so unmerged
  # entities keep their ids. No LLM input changes (applied after the entity_verify pass).
  dedup:
    # regex folds on the key that only reflect Cyrillic -> Latin ambiguity (ц = ts / s, е = ye / e, ъе = ʼe /
    # ye, ё after a consonant, лю = lyu / lu), and a plural "-lar" left unlemmatized ("erlar", "brokerlar")
    translit:
      - ['ts', 's']
      - ['(?<=[bdfgklmnprstvxz])ʼ(?=e)', '']
      - ['(?<![a-zʼ])ye', 'e']
      - ['(?<=[bdfgklmnprstvxz])ye', 'e']
      - ['(?<=[bdfgklmnprstvxz])yo(?!ʼ)', 'o']
      - ['(?<=l)yu', 'u']
      - ['(?<=\w{2})lar(?!\S)', '']
