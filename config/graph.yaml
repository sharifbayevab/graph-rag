    # procedures: a light verb / generic head at the end is stripped when a named-procedure noun precedes
    # ("лицензиялашни амалга ошириш", "экспертиза ўтказиш", "аккредитация қилиш", "медиация тартиб-таомилларини
    # ўтказиш"); "тартиб(-таомил)" is also stripped after a >= 2-lemma verbal-noun name ("ишни … кўриш тартиби")
    light_tails: ['amal oshirish', 'oʼtkazish', 'qilish', 'jarayon']
    generic_heads: ['tartib taomil', 'tartib', 'taomil']
    verbal_noun: '(?:ish|sh)$'
