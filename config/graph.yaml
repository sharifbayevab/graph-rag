    fixed_exclude:
      депутат: '(?i)^(?:депутат|deputat)(?:лик|лиг|lik|lig)'
    # a fixed match of `title` with the owner right before (`before`, anchored at the mention start) or after
    # (`after`, anchored at its end) is the owner's own post: the mention is extended over the owner and gets
    # `key` / `type` ("Қонунчилик палатаси депутатлари" -> the position "qonunchilik palata deputat", not the
    # generic "депутат"; the owner organ inside it is then the post's owner, not a REGULATES target)
    fixed_owner_rewrites:
      - {title: депутат, type: position, key: qonunchilik palata deputat,
         before: '(?i)(?<!\w)(?:(?:Олий\s+Мажлис\w*|Oliy\s+Majlis\w*)\s+)?(?:Қонунчилик\s+палата\w*|Qonunchilik\s+palata\w*)\s+$',
