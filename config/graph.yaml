      - {canonical: маъмурий ҳуқуқбузарлик содир этган шахс, uz: [маъмурий ҳуқуқбузарликларни содир этганлар]}
      - {canonical: доимий яшайдиган чет эл фуқаролари, uz: [hududida doimiy yashaydigan chet el fuqarolari]}
      - {canonical: доимий яшайдиган фуқаролиги бўлмаган шахслар, uz: [доимий яшовчи фуқаролиги бўлмаган шахслар]}
      - {canonical: яккабошчилик асосидаги ижро этувчи органи, uz: [жамиятнинг яккабошчилик асосидаги ижро этувчи органи]}
      - {canonical: Фракция раҳбари, uz: [Сиёсий партия фракциясининг раҳбари]}
    # restores of false drops (item 3). Verify drops overruled when the entity matches:
    restore:
      position_last: [deputat]
      position_keys: ['senat aʼzo']
      # organ classes "… органлари" / subdivisions "… бўлинмалари" of a state body
      organ_last: [organ, boʼlinma]
      organ_state_markers: [davlat, hokimiyat, respublika]
      organ_owner_heads: [vazirlik, inspeksiya, inspektsiya, qoʼmita, agentlik]
      organ_generic_first: [masʼul, maxsus, ish, boshqa, tegishli, manfaatdor, nazorat, milliy]
      # head-typing drops restored as legal_category (abstract head "ҳудуд" in a named legal territory)
      legal_category_keys: ['bojxona hudud']
    # an organ name "<ombudsman>нинг <… органлари>" fuses the post (genitive owner) with the bodies it
    # addresses ("Bolalar ombudsmanining hududiy davlat organlari"): split into the post and the organ
    split_owner_post: '(?i)^(?P<own>.*?(?:омбудсман|ombudsman|вакил|vakil)\w*?(?:нинг|ning))\s+(?P<rest>.+)$'
    split_owner_rest_last: [organ]
    # named research / educational institutions ("Davlat va huquq instituti") are neither state organs nor
    # categories: a capitalised legal_category name with these heads is dropped
    named_institution_heads: [institut, akademiya, universitet]
    # "халқ депутатлари … Кенгашлари": the post word is a modifier inside the council's name -> no REGULATES
    council_modifier_before: '(?i)(?:халқ|xalq)\s+$'
    council_modifier_after: '(?i)^\w*(?:\s+[^\s.;:]+){0,5}?\s+(?:Кенгаш|Kengash)'
  # --- R18 concept filters: no REGULATES -> concept when the concept is only the subject of legislation
  # ("Рақобат тўғрисидаги қонунчилик …") or part of an organ name ("Давлат йўл ҳаракати хавфсизлиги хизмати")
  concept_filters:
    legislation_after: '^[»”"]?\s*(?:тўғрисидаги|to[ʻʼ''`‘’]g[ʻʼ''`‘’]risidagi|ҳақидаги|haqidagi|соҳасидаги|sohasidagi)\s+(?:қонунчилик|qonunchilik|қонун\s+ҳужжатлари|qonun\s+hujjatlari)'
# Neo4j graph store (graphrag.kg.store; Task 10, Rulings R27 / R28)
store:
  # R28 (4): GraphStore.load_graph / drop_versions write only to these host:port (bolt:// or neo4j://): the dev
  # compose grl-neo4j. The document write path (reconcile_structure) is not covered; M7 adds its explicit allow.
  write_endpoints: ["localhost:7688", "127.0.0.1:7688"]
  lock_stale_s: 600      # R28 (7): a load lock older than this may be broken with --break-stale-lock
