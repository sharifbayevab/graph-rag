# Entities (graphrag.kg.extract_ent, Task 6): dictionary + rules, applied to every record's text.
# `organs` / `positions`: fixed names -> one vertex each (title = canonical name); a pattern is matched
# case-insensitively at a word start and extended by \w* (inflection: "Вазирлар Маҳкамасининг").
# `heads`: a head word whose name is the capitalised word run before it ("Иқтисодиёт ва молия вазирлиги",
# "Budjet va iqtisodiy islohotlar masalalari qoʼmitasi"); see `name_rules`. Vertex id ENT/<type>/<norm_key>.
dictionaries:
  organs:
    - {title: Олий Мажлис, patterns: ['Олий\s+Мажлис', 'Oliy\s+Majlis']}
    - {title: Сенат, patterns: ['(?:Олий\s+Мажлис\w*\s+)?Сенат(?!ор)', '(?:Oliy\s+Majlis\w*\s+)?Senat(?!or)']}
    - {title: Қонунчилик палатаси, patterns: ['(?:Олий\s+Мажлис\w*\s+)?Қонунчилик\s+палата', '(?:Oliy\s+Majlis\w*\s+)?Qonunchilik\s+palata', 'Законодательн\w*\s+палат']}
    - {title: Вазирлар Маҳкамаси, patterns: ['Вазирлар\s+Маҳкама', 'Vazirlar\s+Mahkama', 'Кабинет\w*\s+Министров']}
    - {title: Марказий банк, patterns: ['Марказий\s+банк', 'Markaziy\s+bank', 'Центральн\w*\s+банк']}
    - {title: Бош прокуратура, patterns: ['Бош\s+прокуратура', 'Bosh\s+prokuratura', 'Генеральн\w*\s+прокуратур']}
    - {title: Олий суд, patterns: ['Олий\s+суд(?!ья)', 'Oliy\s+sud(?!ya)', 'Верховн\w*\s+суд(?!ь)']}
    - {title: Конституциявий суд, patterns: ['Конституциявий\s+суд(?!ья)', 'Konstitutsiyaviy\s+sud(?!ya)', 'Конституционн\w*\s+суд(?!ь)']}
    - {title: Ҳисоб палатаси, patterns: ['Ҳисоб\s+палата', 'Hisob\s+palata', 'Счетн\w*\s+палат']}
    - {title: маҳаллий давлат ҳокимияти органлари, patterns: ['маҳаллий\s+давлат\s+ҳокимият\w*\s+орган', 'mahalliy\s+davlat\s+hokimiyat\w*\s+organ', 'местн\w*\s+орган\w*\s+государственн\w*\s+власт']}
    - {title: ҳокимлик, patterns: ['ҳокимлик', 'hokimlik', 'хокимият', 'хокимлик']}
  positions:
    - {title: Президент, patterns: ['Президент(?!лик)', 'Prezident(?!lik)']}
    - {title: Бош прокурор, patterns: ['Бош\s+прокурор(?!атура)', 'Bosh\s+prokuror(?!atura)', 'Генеральн\w*\s+прокурор(?!атур)']}
    - {title: Бош вазир, patterns: ['Бош\s+вазир(?!лик|лиг)', 'Bosh\s+vazir(?!lik|lig)', 'Премьер-министр']}
    - {title: Инсон ҳуқуқлари бўйича вакил (омбудсман), patterns: ['(?<!Болалар )(?<!Бола )(?<!Бизнес )(?<!Бизнес-)(?<!Bolalar )(?<!Bola )(?<!Biznes )(?<!Biznes-)(?<!болалар )(?<!bolalar )(?<!бизнес )(?<!biznes )(?:омбудсман|ombudsman)', 'Инсон\s+ҳуқуқлари\s+бўйича\s+вакил', 'Inson\s+huquqlari\s+bo[ʻʼ''`‘’]yicha\s+vakil', 'Уполномоченн\w*\s+по\s+правам\s+человека']}
    - {title: Бола ҳуқуқлари бўйича вакил, patterns: ['(?:Болалар|Бола|Bolalar|Bola)\s+(?:омбудсман|ombudsman)', 'Бола\s+ҳуқуқлари\s+бўйича\s+вакил', 'Bola\s+huquqlari\s+bo[ʻʼ''`‘’]yicha\s+vakil']}
    - {title: Тадбиркорлик субъектларининг ҳуқуқлари ва қонуний манфаатларини ҳимоя қилиш бўйича вакил, patterns: ['(?:Бизнес|Biznes)[\s-]+(?:омбудсман|ombudsman)', 'Тадбиркорлик\s+субъектларининг\s+ҳуқуқлари\s+ва\s+қонуний\s+манфаатларини\s+ҳимоя\s+қилиш\s+бўйича\s+вакил', 'Tadbirkorlik\s+sub[ʻʼ''`‘’]?yektlarining\s+huquqlari\s+va\s+qonuniy\s+manfaatlarini\s+himoya\s+qilish\s+bo[ʻʼ''`‘’]yicha\s+vakil']}
    - {title: раислик қилувчи, patterns: ['Раислик\s+қилувчи', 'Raislik\s+qiluvchi', 'Председательствующ']}
    - {title: сенатор, patterns: ['сенатор', 'senator']}
    - {title: депутат, patterns: ['депутат', 'deputat']}
    - {title: ҳоким, patterns: ['ҳоким(?!лик|лиг|ият)', 'hokim(?!lik|lig|iyat)']}
  heads:
    organ:
      - 'вазирлиг\w*'
      - 'vazirlig\w*'
      - 'қўмита(?:си|лари)\w*'
      - 'qo[ʻʼ''`‘’]mita(?:si|lari)\w*'
      - 'агентлиг\w*'
      - 'agentlig\w*'
      - 'инспекция(?:си|лари)\w*'
      - 'inspeksiya(?:si|lari)\w*'
      - 'комиссия(?:си|лари)\w*'
      - 'komissiya(?:si|lari)\w*'
      - 'кенгаши\w*'
      - 'kengashi\w*'
      - 'ҳокимлиги\w*'
      - 'hokimligi\w*'
    position:
      - 'вазир(?:и|ининг|ига|идан|ини|лари|ларининг)(?!\w)'
      - 'vazir(?:i|ining|iga|idan|ini|lari|larining)(?!\w)'
      - 'раис(?:и|ининг|ига|идан|ини)(?!\w)'
      - 'rais(?:i|ining|iga|idan|ini)(?!\w)'
      - 'вакил(?:и|ининг|ига|идан|ини)(?!\w)'
      - 'vakil(?:i|ining|iga|idan|ini)(?!\w)'
  name_rules:
    max_words: 10            # words before the head
    # a word that ends a name going backwards (lower-cased; apostrophes folded to ʼ)
    stop_words: [ушбу, мазкур, бунда, шунингдек, шу, бу, ёки, билан, учун, томонидан, орқали, мувофиқ, кўра, асосан, биргаликда, ҳамкорликда, тегишли, ваколатли, барча, айрим, ҳар, сўз, савол, саволим, мурожаат, ҳурматли, деган, сўзлар, мен, биз, сиз, улар, ҳамма, янги, ushbu, mazkur, bunda, shuningdek, shu, bu, yoki, bilan, uchun, tomonidan, orqali, muvofiq, koʼra, asosan, birgalikda, hamkorlikda, tegishli, vakolatli, barcha, ayrim, har, soʼz, savol, savolim, murojaat, hurmatli, degan, soʼzlar, men, biz, siz, ular, hamma, yangi]
    # a capitalised word at a sentence start begins a name only if the corpus mostly writes it capitalised
    # mid-sentence (proper-name word: "Adliya", not "Chunki" / "Hozir" / "Maʼlumki"); casing counts come from
    # the records being processed. A comma is never crossed between two capitalised words
    # ("Vazirlar Mahkamasi, Kadastr agentligi").
    # "ва"/"va" inside a name ("Иқтисодиёт ва молия вазирлиги") is allowed when a word follows it in the name
    inner_words: [ва, va, ҳамда, hamda, и]
    # a word ending like this ends the name (genitive owner, dative / locative / ablative, "-даги" qualifier)
    stop_suffix: '(?:нинг|ning|га|ga|да|da|дан|dan|даги|dagi|миз|нгиз|miz|ngiz|(?<!ор)ган|(?<!or)gan)$'
    # a head word with a 1st / 2nd person possessive is not a name ("vazirligimiz", "agentligingiz")
    head_block: '(?:миз|нгиз|miz|ngiz)\w{0,6}$'
    # "Ўзбекистон Республикаси(нинг)" before a name is dropped
    prefix: '^(?:Ўзбекистон\s+Республикаси\w*|O[ʻʼ''`‘’]?zbekiston\s+Respublikasi\w*|Республики\s+Узбекистан)\s+'
    # key rewrites (regex on norm_key -> replacement): "Олий Мажлис Сенати" = "Сенат" (LLM names too)
    key_rewrites:
      - ['^oliy majlis (?=senat|qonunchilik palata|inson huquq|bola huquq)', '']
      - ['^(inson huquq boʼyicha vakil) ombudsman$', '\1']
      - ['^ombudsman$', 'inson huquq boʼyicha vakil']
      # R16: "X ҳузуридаги Y" -> Y (the owned body / post); an owner stays a separate mention
      - ['^.* huzur (?=\S)', '']
      # R17: cross-script bank; regional representatives of the child ombudsman
      - ['(?<!\S)банк(?!\S)', 'bank']
      - ['^(?:bola (?:ombudsman|huquq boʼyicha vakil)|ombudsman)(?: hudud)? mintaqaviy vakil$', 'bola huquq boʼyicha vakil mintaqaviy vakil']
    # a lower-case owner right before a position head: "қўмита раиси", "hukumat vakili"
    generic_owners: [маҳалла, mahalla, қўмита, qoʼmita, комиссия, komissiya, кенгаш, kengash, ҳукумат, hukumat, палата, palata, сенат, senat, вазирлик, vazirlik, агентлик, agentlik, ҳокимлик, hokimlik]
  # --- fix round 1 (Ruling R15) ---
  # a mention in these contexts is dropped (no vertex mention, no REGULATES): inside an official-gazette
  # citation parenthesis (patterns.refs.gazette), inside an act title / code name (acts.scan_act_mentions),
  # or in a committee conclusion's author heading: the paragraph before a `boilerplate` heading and the
  # heading's own text before it ("Yuqorida bayon etilganlarga asoslanib, … qoʼmitasi" / "XULOSA QILADI:")
  context:
    boilerplate: '(?:Х\s?У\s?Л\s?О\s?С\s?А\s+Қ\s?И\s?Л\s?А\s?Д\s?И|X\s?U\s?L\s?O\s?S\s?A\s+Q\s?I\s?L\s?A\s?D\s?I|хулоса\s+қилади|xulosa\s+qiladi)'
  # names that are persons or clauses, not entities
  name_filter:
    max_words: 15
    patronymic: '(?i)\w+(?:ovich|evich|ovna|evna|ович|евич|овна|евна)(?!\w)|(?<!\w)(?:o[ʻʼ''`‘’]?g[ʻʼ''`‘’]?li|ўғли|qizi|қизи)(?!\w)'
  # retyping by the key's last lemma (internal Latin / Russian normal form), then a majority vote per key
  retype:
    position: [prokuror, vazir, rais, vakil, deputat, senator, hokim, ombudsman, sudya, prezident, spiker, notarius, inspektor, oʼrinbosar, kotib, boshliq, direktor, rahbar, прокурор, министр, председатель, депутат, сенатор, хоким, судья, уполномоченный]
    organ: [vazirlik, qoʼmita, agentlik, sud, prokuratura, hokimlik, inspeksiya, inspektsiya, palata, kengash, komissiya, departament, boshqarma, министерство, комитет, агентство, суд, прокуратура, палата, совет, комиссия, инспекция]
    order: [organ, position, legal_category, procedure]   # majority-vote tie break
    # after verification: a "procedure" named by a document noun is a legal_category (a contract, a
    # licence, a permit, a certificate …: "қўшиб олиш тўғрисидаги шартнома", "… ҳуқуқи учун гувоҳнома")
    documents: [shartnoma, ishonchnoma, guvohnoma, litsenziya, ruxsatnoma, sertifikat, patent, xabarnoma, hujjat, dalolatnoma, varaqa, talabnoma, ariza, договор, доверенность, лицензия, свидетельство, уведомление, разрешение, сертификат, патент]
  # --- fix round 2 (Ruling R16) ---
  # An entity's type is decided by its head: the key's last lemma (Uzbek), the first (or second, after an
  # adjective) lemma (Russian). `heads`: the head nouns of a type; `conditional`: a head that counts only
  # when the key also holds one of the listed lemmas (@organ / @position = any head of that type);
  # `category`: heads that make the name a legal_category (funds, organisations as legal entities,
  # employees, founders, private roles, documents). A head in no list: legal_category names stay, the
  # others are dropped. Fixed dictionary names keep their type.
  types:
    organ:
      heads: [vazirlik, qoʼmita, agentlik, sud, prokuratura, hokimlik, hokimiyat, inspeksiya, inspektsiya, palata, kengash, komissiya, departament, boshqarma, bank, markaz, organ, muassasa, hayʼat, majlis, senat, xizmat, maʼmuriyat, boʼlinma, idora, kotibiyat, apparat, qoʼmondonlik, hukumat, parlament, kengesi, institut, byuro, gvardiya, administratsiya, administratsiyasi, maʼmuriyati, direktsiya, fraktsiya, fraksiya, assambleya, akademiya, universitet, laboratoriya, advokatura, shifoxona, vakolatxona, filial]
      ru: [министерство, комитет, агентство, суд, прокуратура, палата, совет, комиссия, орган, банк, служба, инспекция, управление, департамент, центр, кабинет, сенат, парламент, правительство]
      generic_first: [manfaatdor, tegishli, boshqa, barcha, ayrim, har, zarur, yuqori, oʼz]
    position:
      heads: [vazir, rais, prokuror, sudya, hokim, prezident, spiker, ombudsman, senator, deputat, direktor, inspektor, notarius, tergovchi, kotib, elchi, konsul, mudir, mudiri, kotibi, attashe]
      conditional:
        oʼrinbosar: ['@position', '@organ']
        vakil: [huquq, ombudsman]
        rahbar: ['@organ']
        ijrochi: [davlat]
        yordamchi: ['@position']
        boshliq: ['@organ']
        boshligʼi: ['@organ']
        boshliqlar: ['@organ']
      ru: [председатель, министр, прокурор, судья, президент, уполномоченный, депутат, сенатор, хоким, премьер-министр]
    procedure:
      heads: [tartib, taomil, ekspertiza, akkreditatsiya, sertifikatlash, sertifikatlashtirish, litsenziyalash, sanatsiya, tugatish, bankrotlik, mediatsiya, ratifikatsiya, denonsatsiya, apellyatsiya, kassatsiya, taftish, tekshiruv, audit, verifikatsiya, attestatsiya, privatizatsiya, rejim, patentlash, koʼrik, tekshirish, konvertatsiya, xususiylashtirish, auktsion, auksion, inventarizatsiya, deklaratsiyalash, muhokama, yarash, imtihon]
      # a generic verbal head counts only right after a named-procedure noun ("аккредитациядан ўтказиш",
      # "санация қилиш", "тугатиш жараёни", "банкрот деб топиш ва тугатишга доир иш юритиш")
      conditional: [oʼtkazish, oʼtkazganlik, qilish, etish, jarayon, yuritish, jarayoni, oshirish]
      tails: ['roʼyxat oʼtkazilish', 'roʼyxat oʼtkazganlik', 'ovoz berish', 'taʼsir baholash', 'hisob yuritish', 'davlat hisob', 'reestr chiqarish', 'reestr kiritish', 'nazorat olish', 'chiqarib yuborish', 'qoʼshib yuborish', 'qoʼshib yuborilish', 'davlat nazorat', 'notarial harakat', 'jamiyat chiqish', 'jamiyat boʼlish', 'qoʼshib olish', 'ajratib chiqarish', 'hisob chiqarish', 'parlament soʼrov yuborish', 'parlament soʼrov', 'taomil amal oshirish', 'ish yuritish', 'roʼyxat oʼtkazish', 'roʼyxat olish', 'roʼyxat oʼtish', 'hisob olish', 'hisob qoʼyish', 'tartib koʼrish', 'tartib koʼrib chiqish', 'qayta koʼrish', 'qayta tashkil etish']
      ru: [исполнение, списание, конвертация, ликвидация, санация, регистрация, лицензирование, аккредитация, экспертиза, проверка, реорганизация, процедура, банкротство, медиация, ратификация, аудит, сертификация, приватизация, денонсация]
      # R17: a verb head with a procedural object ("кассация шикоятини иш юритишга қабул қилиш",
      # "қонунчилик ташаббуси … кўриб чиқиш", "шикоят бериш")
      object_verbs: ['koʼrib chiqish', 'qabul qilish', 'berish', 'yuborish', 'koʼrish', 'eshitish', 'ijro etish', 'olish', 'rasmiylashtirish', 'tayinlash']
      objects: [shikoyat, ariza, ish, tashabbus, soʼrov, murojaat, protest, loyiha, talabnoma, taklif, axborot, hisobot, maʼruza, hujjat, hukm, patent, litsenziya, ruxsatnoma, guvohnoma, polis, pensiya, nafaqa]
    category:
      heads: [uyushma, assotsiatsiya, ittifoq, jamgʼarma, fond, hisobvaraq, tashkilot, korxona, jamiyat, xodim, shaxs, muassis, ishtirokchi, aʼzo, xizmatchi, mutaxassis, buxgalter, boshqaruvchi, likvidator, tugatuvchi, advokat, vakil, rahbar, ijrochi, oʼrinbosar, yordamchi, fuqaro, subʼekt, shartnoma, ishonchnoma, guvohnoma, litsenziya, ruxsatnoma, sertifikat, patent, xabarnoma, hujjat, dalolatnoma, varaqa, talabnoma, ariza, shikoyat, protest, ajrim]
      # R17 legal_category: activity / verbal-noun heads, abstract heads and obligations are no categories
      activity: [savdo, faoliyat, boshqaruv, muomala, ishlab, xizmat koʼrsatish, taʼlim tarbiya]
      nominalisation: '(?:ish|ash|sh)$'
      abstract: [sifat, tarmoq, shakl, atrof, muhit, soha, yoʼnalish, masala, holat, jarayon, maqsad, ehtiyoj, sharoit, imkoniyat, natija, daraja, tur, qism, chora, tadbir, munosabat, qoida, prinsip, vazifa, funksiya, vakolat, siyosat, intizom, tuman, shahar, viloyat, hudud, sohasi, отношение, форма, сфера, отрасль]
      obligation: [majburiyat, masʼuliyat, javobgarlik, qarzdorlik, обязательство, ответственность]
      # a post named as a category ("Ҳукумат аъзолари", "Сенат аъзоси") -> position
      member_heads: [aʼzo]
      member_owners: [hukumat, senat, kengash, palata, komissiya, qoʼmita, parlament, majlis]
      # non-state bodies (associations, farmers' / public councils, chambers of commerce) -> legal_category
      nonstate_markers: [fermer, tadbirkor, jamoatchilik, homiylik, savdo sanoat, hunarmand, taftish]
      nonstate_heads: [kengash, palata, markaz, komissiya]
      # legal_category names headed by a quantity / amount are not categories ("… баланс қиймати")
      quantity: [qiymat, miqdor, summa, foiz, muddat, hajm, narx, stavka, koʼrsatkich, ulush, foyda, zarar, xarajat, nobudgarchilik, стоимость, сумма, размер, срок, доля]
      ru: [фонд, организация, лицо, работник, сотрудник, управлять, управляющий, ликвидатор, акционер, кредитор, договор, доверенность, лицензия, свидетельство, уведомление, разрешение, сертификат, патент, общество]
  # a name whose last word is a finite verb / participle is a clause, not an entity (replaces the word cut)
  clause_final: '(?:ади|йди|моқда|син|сун|лади|илади|бўлса|мумкин|лозим|керак|эмас|этади|қилади|ган|дир|ганлиги|ганлик|adi|ydi|moqda|sin|sun|ladi|iladi|boʼlsa|mumkin|lozim|kerak|emas|etadi|qiladi|(?<!or)gan|dir|ganligi|ganlik)$'
  # REGULATES context (R16 rule 4): an owner right before "ҳузуридаги" (the edge goes to the owned body only);
  # words inside «…» деган сўзлар (replaced / deleted words); intro / closing boilerplate sentences; an organ
  # name used as a bare modifier ("Марказий банк курси")
  context2:
    owner_after: '^\s*(?:ҳузуридаги|huzuridagi|қошидаги|qoshidagi|тасарруфидаги|tasarrufidagi|ҳузурида|huzurida)(?!\w)'
    quoted_words_after: '^\s*[»”"]*\s*(?:деган|degan)\s+(?:сўз|so[ʻʼ''`‘’]z|рақам|raqam|жумла|jumla)'
    boilerplate:
      - '(?:томонидан|tomonidan)[^.;\n]{0,140}?(?:қабул\s+қилинган|qabul\s+qilingan)'
      - '(?:кун\s+тартибига\s+киритиш\s+ҳақидаги\s+тавсия|kun\s+tartibiga\s+kiritish\s+haqidagi\s+tavsiya)[^.;\n]{0,200}?(?:киритилсин|kiritilsin)'
      - '(?:маъруза\s+билан\s+сўзга\s+чиқиш|ma[ʻʼ''`‘’]ruza\s+bilan\s+so[ʻʼ''`‘’]zga\s+chiqish)[^.;\n]{0,300}?(?:топширилсин|topshirilsin)'
      - '(?:кўриб\s+чиқиш\s+учун|ko[ʻʼ''`‘’]rib\s+chiqish\s+uchun)\s+(?:келиб\s+туш|kelib\s+tush|юборил|yuboril|киритил|kiritil)\w*'
    modifier_after: '^\s*(?:курс|kurs|ставка|stavka|қайта\s+молиялаш|qayta\s+moliyalash)\w*'
    # a genitive owner of an act ("Президентининг 2025 йил 15 апрелдаги «…» Фармони", "Вазирлар Маҳкамасининг …
    # қарори"): the act noun within `act_owner_window` chars, with <= act_owner_words other words between
    # (quoted titles, dates and numbers not counted), no sentence break
    act_owner_noun: '(?<!\w)(?:фармон|қарор|фармойиш|мурожаатнома|топшириқ|farmon|qaror|farmoyish|murojaatnoma|topshiriq|указ|постановлени|распоряжени|послани)\w*'
    act_owner_window: 300
    act_owner_words: 8
    # committee conclusions only: the drafter of the law ("… вазирлиги томонидан ишлаб чиқилди")
    drafted_by: '(?:томонидан|tomonidan|ташаббуси\s+билан|tashabbusi\s+bilan)[^.;\n]{0,160}?(?:ишлаб\s+чиқил|ishlab\s+chiqil|тайёрлан|tayyorlan|киритил(?:ди|ган)|kiritil(?:di|gan))\w*'
    # Ruling R20 (b), applied after verification (no LLM input changes): adoption / approval / signature
    # lines state legislative history, not regulation -> no REGULATES for the agent (a mention followed by
    # `adoption_agent_after`) of a sentence whose predicate is `adoption_final` ("… ишлаб чиқилди ва
    # Қонунчилик палатаси томонидан қабул қилинди."), for a mention right after a Russian `adoption_before`
    # short participle naming a chamber (`adoption_before_names`: "Принят Законодательной палатой", "Одобрен
    # Сенатом"; not "принятым Центральным банком решением"), and for any mention in a short
    # (<= adoption_header_chars) header paragraph `adoption_header` ("Сенат томонидан 2024 йил 5 июнда маъқулланган")
    # Ruling R29 B: + the past history predicates "… рад этилган." / "rad etilgan." and the pluperfect "… имзоланган
    # эди." (a converb "қабул қилиниб, …" / "маъқулланиб, …" in the sentence then needs no own rule); a present /
    # conditional norm ("… маъқулланиб, … юборилади", "рад этилган тақдирда") does not end so
    adoption_final: '(?:қабул\s+қилинди|маъқулланди|маъқуллади|имзоланди|qabul\s+qilindi|ma[ʻʼ''`‘’]qullandi|ma[ʻʼ''`‘’]qulladi|imzolandi|(?:рад|rad)\s+(?:этилган|etilgan)|(?:қабул\s+қилинган|маъқулланган|имзоланган|рад\s+этилган|qabul\s+qilingan|ma[ʻʼ''`‘’]qullangan|imzolangan|rad\s+etilgan)\s+(?:эди|edi))\W*$'
    # R29 B: a chamber in the genitive before its (numbered) plenary session ("Олий Мажлиси Сенатининг 25 ялпи
    # мажлисида … маъқулланиб, … имзоланган эди.") is the adopting agent too (with an adoption_final sentence)
    adoption_session_after: '^\w*\s+(?:\d+\s*[-–]?\s*(?:сонли\s+|sonli\s+)?)?(?:ялпи\s+мажлис|yalpi\s+majlis)\w*'
    adoption_agent_after: '^\w*\s+(?:томонидан|tomonidan)(?!\w)'
    adoption_before: '(?<!\w)(?:принят|одобрен|подписан)[аоы]?\s+$'
    adoption_before_names: '^(?:Законодательн|Сенат)'
    adoption_header: '(?m)^[^.;:\n]{0,80}(?:томонидан|tomonidan)\s[^.;:\n]{0,60}(?:қабул\s+қилинган|маъқулланган|qabul\s+qilingan|ma[ʻʼ''`‘’]qullangan)\W*$|^\s*(?:принят|одобрен)[аоы]?\s+(?:Законодательн\w*\s+палат\w*|Сенат\w*)[^\n]{0,60}$'
    adoption_header_chars: 160
  # cross-language / variant names of one entity (R16 rule 7): every name's key maps to the canonical key
  aliases:
