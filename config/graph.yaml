    - {canonical: Тадбиркорлик субъектларининг ҳуқуқлари ва қонуний манфаатларини ҳимоя қилиш бўйича вакил, names: [Бизнес омбудсман, Biznes ombudsman, Бизнес-омбудсман]}
    - {canonical: Инсон ҳуқуқлари бўйича вакил, names: [Уполномоченный по правам человека]}
  # applied after verification (R16 strict self-check; no LLM input changes): anaphoric names ("уларнинг
  # оила аъзолари"), names with numbers / head counts ("юз минг нафардан кам бўлмаган фуқаролари"), bare
  # generic organ words ("вазирлик"), organ / position alternatives ("апелляция ёки кассация инстанцияси суди")
  post_verify:
    anaphora_first: [уларнинг, унинг, ўз, ўзининг, ушбу, мазкур, шу, ularning, uning, oʼz, oʼzining, ushbu, mazkur, shu, их, его, её]
    count_words: '(?i)\d|(?<!\w)(?:нафар|nafar)\w*'
    # an agent phrase inside a name is a clause fragment ("Qoʼmita tomonidan manfaatdor vazirliklar")
    fragment_words: '(?i)(?<!\w)(?:томонидан|tomonidan)(?!\w)'
    generic_organ_keys: [filial, vakolatxona, kotibiyat, bank, банк, vazirlik, agentlik, qoʼmita, komissiya, idora, organ, muassasa, markaz, kengash, boshqarma, xizmat, inspeksiya, departament, boʼlinma, davlat organ, davlat muassasa, davlat tashkilot]
    # bare generic posts (no owner): dropped
    generic_position_keys: [direktor, rais, rahbar, boshliq, boshligʼi, oʼrinbosar, kotib, mudir, yordamchi, директор, председатель, руководитель]
    # corporate bodies / roles (a company's boards and officers are not public institutions / posts) -> legal_category
    corporate_lemmas: [jamiyat, aksiyador, kollegial, yakkaboshchilik, kuzatuv, xususiy, tijorat, общество, акционер, наблюдательный, правление, частный, коммерческий]
    # banks other than the fixed Марказий банк are legal entities (legal_category), not state organs
    category_organ_heads: [bank, банк, laboratoriya, institut, akademiya, universitet, shifoxona]
    # a position name listing several posts ("… бошлиғи ва унинг ўринбосарлари", "… ўринбосари – … раиси"): dropped
    position_list: '(?i)\s(?:ва|va|ҳамда|hamda|и)\s+(?:унинг|uning|уларнинг|ularning)\s|\s[–—]\s'
    # a name followed by "… тўғрисидаги кодекс / қонун" is part of an unquoted act title: no REGULATES
    act_title_after: '(?i)^\s*(?:[^\s.;:]+\s+){0,5}?(?:(?:тўғрисидаги|to[ʻʼ''`‘’]g[ʻʼ''`‘’]risidagi|ҳақидаги|haqidagi)\s+(?:кодекс|kodeks|қонун|qonun)|(?:ҳақида|haqida|тўғрисида|to[ʻʼ''`‘’]g[ʻʼ''`‘’]risida)[ \t]*(?:\n|$))'
    # Ruling R20 (d), after verification (the dictionary pattern itself feeds the entity_verify input, so a
